<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      M-IDE-1 (OBI-179 threat model v2 §5, OBI-180). The same policy
      loom-http stamps on the static bundle as a `Content-Security-
      Policy` header, minus the directives a `<meta>` cannot carry
      (`frame-ancestors` is ignored in meta per the CSP spec, which is
      why OBI-294 ships it as a header). Two policies on one document are
      both enforced, so this copy can only narrow the header, never widen
      it: it is here so the page stays held to `script-src 'self'` if the
      bundle is ever served without loom-http in front of it.

      Tighter than the header on purpose: no `style-src 'unsafe-inline'`
      (that exception exists only for Monaco, and the player client's
      stylesheet now lives in loom.css) and no `worker-src blob:`.

      No `connect-src` and no `default-src` here, unlike `admin.html`:
      this page opens the same-origin `/ws` socket, and a `<meta>` cannot
      name the host it will be served from. CSP3 matches `'self'` on scheme
      equality with only an http->https allowance, and MDN records that
      `connect-src 'self'` "does not resolve to websocket schemes in all
      browsers" -- so a `default-src 'self'` here would fill in for the
      missing `connect-src` and could silently kill the player's connection.
      The websocket source is loom-http's job: `static_csp` pins
      `connect-src 'self' ws://<this host> wss://<this host>` from the
      request's own `Host`, and `scripts/check-static-csp.mjs` keeps this
      page in that rule's socket list. If this page ever gains a second
      socket host, it goes in the header as an explicit host -- never a
      wildcard, and never here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>Loom</title>
    <link rel="stylesheet" href="./loom.css" />
  </head>
  <body>
    <div id="pane"></div>
    <input id="input" autofocus placeholder="type a command and press enter" />
    <!--
      External module only (M-IDE-1): `script-src 'self'` blocks an inline
      `<script>`, so the bootstrap lives in `src/main.ts` and ships as
      `dist/main.js`. `scripts/check-static-csp.mjs` enforces that no
      served page grows an inline script, style attribute, or `on*=`
      handler back (O3-T6).
    -->
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
