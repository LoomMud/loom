<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loom</title>
    <style>
      body { font-family: monospace; background: #111; color: #ddd; margin: 0; }
      #pane { white-space: pre-wrap; height: 80vh; overflow-y: auto; padding: 0.5rem; }
      #input { width: 100%; box-sizing: border-box; font-family: monospace; }
    </style>
  </head>
  <body>
    <div id="pane"></div>
    <input id="input" autofocus placeholder="type a command and press enter" />
    <script type="module">
      import { mountLoomClient } from "./dist/app.js";

      const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
      mountLoomClient({
        pane: document.getElementById("pane"),
        input: document.getElementById("input"),
        wsUrl,
      });
    </script>
  </body>
</html>
