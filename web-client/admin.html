<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      M-IDE-1/M-IDE-2 (OBI-179 threat model): a strict CSP for the admin
      pages -- no inline scripts/styles, no remote script origins beyond
      `'self'`, no `object`/embed, no framing. Every page module under
      `src/admin/` only ever builds DOM via `createElement`/`textContent`
      (`src/admin/dom.ts`), so there is no inline-script/style need this
      CSP would have to carve an exception for.

      Unlike `index.html` and `ide.html`, this page keeps a standalone
      `default-src 'self'`: the admin UI only ever does same-origin
      `fetch` (`src/admin/api.ts`), and `connect-src 'self'` covers that in
      every browser. If an admin screen ever gains a WebSocket, this page
      must join `SOCKET_PAGES` in `scripts/check-static-csp.mjs` and drop
      both directives -- a `<meta>` cannot name the host it is served from.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>Loom admin</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <nav id="admin-nav"></nav>
    <main id="admin-main"></main>
    <div id="admin-modal" class="step-up-overlay"></div>
    <!-- External module only: `script-src 'self'` blocks inline scripts. -->
    <script type="module" src="./dist/admin/main.js"></script>
  </body>
</html>
