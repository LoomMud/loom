<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      M-IDE-1/M-IDE-2 (OBI-179 threat model v2 §5, OBI-180): the staff
      origin carries a live session cookie, so this page is the one the
      threat model calls "an XSS amplifier, not an annoyance".

      It is nearly identical to the header `loom-http` stamps on the
      static bundle, and for one reason: Monaco needs two things a bare
      `script-src 'self'` / `style-src 'self'` policy forbids -- it
      injects `<style>` elements as it measures text, and it puts its
      language services in a `blob:` worker. The threat model grants both
      as *scoped exceptions*, and a `<meta>` policy is the scoping
      mechanism: a document with two policies is held to the intersection
      of them, so the header's carve-outs can be opened back up here, for
      this document only, without touching the player page.

      What is NOT granted, and is the point of the exercise:
        - `script-src 'self'` with no `unsafe-inline` and no `unsafe-eval`
          -- the bootstrap is `./dist/ide/amd-boot.js`, and Monaco's
          minified AMD `vs/loader.js` uses `new Function` internally,
          which is why `unsafe-eval` would have to be *added* if the
          vendored loader ever needed it. It does not: the loader is
          same-origin code and `'self'` covers it. If a future Monaco
          version starts demanding `unsafe-eval`, that is a threat-model
          question for the CTO, not a one-line change here.
        - `img-src 'self'` (no `data:`) -- M-IDE-2's "no remote images":
          a `data:` URI is not remote, but a staff page that will render
          an arbitrary image URL is one `new URL()` away from exfiltrating
          the session, so image sources stay file-served and counted.
        - `frame-ancestors 'none'` -- ignored in `<meta>` (CSP spec), so
          it lives in the header. It is kept here anyway as documentation
          of intent and for the case where the page is loaded from a
          filesystem URL during local development.
        - `form-action 'self'`, `base-uri 'none'` -- no cross-origin form
          exfil, no `<base>` hijack of the relative `./vendor/...` paths.
        - no `connect-src`, and therefore no `default-src` either. This
          page dials `/lsp` as a WebSocket (M-LSP-1), and a `<meta>` is
          fixed text: it cannot name the host it will be served from, and
          `connect-src 'self'` does not cover `ws:`/`wss:` in every browser
          (MDN says so outright). `default-src 'self'` would stand in for a
          missing `connect-src` and break the socket the same way. So
          `static_csp` in loom-http owns `connect-src`, pinned to the
          request's own `Host`; `scripts/check-static-csp.mjs` keeps
          `ide.html` in the socket-page list that enforces this split.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>Loom IDE</title>
    <link rel="stylesheet" href="./ide.css" />
    <!--
      The version in these two URLs is load-bearing, not a comment: it is
      what lets `loom-http` serve this directory with
      `Cache-Control: public, max-age=31536000, immutable` (OBI-338), which
      is the only reason 21.9 MB of self-hosted Monaco is affordable on an
      IDE load. `immutable` is safe exactly while the URL changes whenever
      the bytes do, so the vendored tree is staged at a directory named for
      the `monaco-editor` version this page needs.

      Which means a bump edits this file. `scripts/vendor-monaco.mjs`
      refuses to stage anything unless every reference here and in
      `src/ide/amd-boot.ts` names the version it is staging, so forgetting
      is a failed build rather than a year of 404s -- or, the other way
      round, a year of cached bytes that belong to the version before.
    -->
    <link rel="stylesheet" href="./vendor/monaco/0.57.0/vs/editor/editor.main.css" />
    <!--
      External classic script only (M-IDE-1). It is `defer`red and loads
      Monaco's AMD loader before the app module; see `src/ide/amd-boot.ts`
      for why this one file is not an ES module.
    -->
    <script defer src="./vendor/monaco/0.57.0/vs/loader.js"></script>
    <script type="module" src="./dist/ide/amd-boot.js"></script>
  </head>
  <body>
    <!--
      The sign-in gate mounts here (`renderSignInPage`, reused from the
      admin pages: an IDE login *is* a staff login, so there is no second
      place to get T-IDE-7's session rules wrong), and is removed once a
      token exists. Everything below it is inert until then -- the tree's
      first request is what the token authorises.
    -->
    <div id="ide-auth"></div>
    <header id="ide-header">
      <span id="ide-title">Loom IDE</span>
      <span id="ide-path"></span>
      <span id="ide-status" role="status"></span>
      <button id="ide-save" type="button" disabled>Save</button>
      <button id="ide-signout" type="button" class="ghost">Sign out</button>
    </header>
    <div id="ide-main">
      <aside id="ide-tree" aria-label="Mudlib files"></aside>
      <div id="ide-editor"></div>
    </div>
    <section id="ide-diagnostics" aria-label="Compiler diagnostics"></section>
    <noscript>The Loom IDE needs JavaScript; the player client at / is a
      plain terminal and does not.</noscript>
  </body>
</html>
