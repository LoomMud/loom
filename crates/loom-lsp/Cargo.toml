[package]
name = "loom-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "loom-lsp"
path = "src/main.rs"

[dependencies]
loom-compiler = { path = "../loom-compiler" }
loom-syntax = { path = "../loom-syntax" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
crossbeam-channel = "0.5.17"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
percent-encoding = "2.3.1"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.14.0"
