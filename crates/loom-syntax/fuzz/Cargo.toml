#
# `cargo fuzz` targets for the Weft parser (trust boundary: builder source).
# Not a workspace member: it needs nightly and libFuzzer. Run with
#   scripts/fuzz-smoke.sh            (CI smoke, <= 60 s)
#   cargo +nightly fuzz run parse    (from crates/loom-syntax, open-ended)

[package]
name = "loom-syntax-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
loom-syntax = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Keep this crate out of the main workspace.
[workspace]
members = ["."]
