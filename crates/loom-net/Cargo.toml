[package]
name = "loom-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# WebSocket message/frame types only (`axum::extract::ws`); the axum Router
# itself lives in `loom-http`. Kept here, not re-exported, because the
# WebSocket connection handler needs the same rate limiter, line cap and
# output backpressure as the telnet path (`ws.rs` is a sibling of this
# crate's telnet codec, not a wrapper around it).
axum = { version = "0.8.4", default-features = false, features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Global-recorder facade only (OBI-149): whatever process installs a
# recorder (`loom-obs::init_tracing`/`Metrics::install`, `loom-cli`) picks
# these counters up; loom-net itself never depends on loom-obs.
metrics = "0.24.6"

# OBI-362: the reclaim liveness probe asks the kernel, not tokio's readiness
# cache, whether a peer FIN has already landed (`Socket::peek` ==
# `recv(MSG_PEEK)`) -- the bytes it reports on have to stay in the queue for
# the copyover's new owner. `SockRef` borrows the fd from any `AsFd`, so this
# needs no `unsafe` (which `unsafe_code = "deny"` in the workspace forbids)
# and no fd hand-offs. Unix only: `peer_sent_fin` has a documented fallback
# elsewhere. MIT/Apache-2.0, already in Cargo.lock via mio.
[target.'cfg(unix)'.dependencies]
socket2 = "0.6.5"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
