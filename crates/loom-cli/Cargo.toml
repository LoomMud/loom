[package]
name = "loom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
loom-compiler = { path = "../loom-compiler" }
loom-http = { path = "../loom-http" }
loom-net = { path = "../loom-net" }
loom-obs = { path = "../loom-obs" }
loom-persist = { path = "../loom-persist" }
loom-supervise = { path = "../loom-supervise" }
loom-vm = { path = "../loom-vm" }
metrics = "0.24.6"
time = { version = "0.3.44", features = ["macros"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1.48.0", features = ["test-util"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.18.1", features = ["v4"] }
