[package]
name = "loom-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
hmac = "0.13.0"
# `tower-http`'s `ServeDir` already formats `Last-Modified` with this; the
# static cache validator (OBI-338) reads it back. MIT OR Apache-2.0, already
# in the lockfile graph, so no new supply chain for the licence gate.
httpdate = "1.0.3"
loom-git = { path = "../loom-git" }
loom-lsp = { path = "../loom-lsp" }
loom-net = { path = "../loom-net" }
loom-obs = { path = "../loom-obs" }
loom-persist = { version = "0.0.1", path = "../loom-persist" }
lsp-server = "0.10.0"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.48.0", features = ["net", "sync", "time"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "gen_secret", "otpauth"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1.41"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
serde_json = "1.0.145"
tempfile = "3.14"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tokio-tungstenite = "0.29.0"
