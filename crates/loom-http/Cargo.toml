[package]
name = "loom-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.23.1"
hmac = "0.13.0"
loom-net = { path = "../loom-net" }
loom-obs = { path = "../loom-obs" }
loom-persist = { version = "0.0.1", path = "../loom-persist" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.48.0", features = ["net", "sync", "time"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "gen_secret", "otpauth"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.41"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
serde_json = "1.0.145"
tempfile = "3.14"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", default-features = false, features = ["util"] }
