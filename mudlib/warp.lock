#
# The Warp mudlib the CI load lane serves (OBI-326).
#
# Why this file exists. `loadtest-e1-1` and `loadtest-smoke` build loom from
# this checkout, then run `loom-cli serve --mudlib warp`, where `warp` is a
# *second* repository checked out inside the job. The mudlib is an input to the
# p99 this gate prints: a warp-side change to a hot path (fan-out in the
# Entrance Hall, the login state machine, `/std/player` save work) moves the
# number without a single loom file changing. Before OBI-326 that checkout was
# unpinned, so the number also could not be attributed to a mudlib version --
# and after OBI-325 the lane can *skip* a run, which turns "unattributed" into
# "blamed on the next source PR". So the mudlib is pinned the way `Cargo.lock`
# pins dependencies.
#
# What reads it.
#   * `.github/workflows/ci.yml` -- the `warp-pin` step in each load job reads
#     `repository` and `rev` below and checks that exact commit out. There is no
#     fallback: a missing or malformed pin fails the gate rather than quietly
#     serving `main`'s tip again.
#   * `scripts/check-ci-load-lane.py` rule 9 -- `hygiene` (a required check)
#     re-reads this file and refuses any workflow that serves a mudlib from an
#     unpinned checkout, so the pin cannot rot into a comment.
#   * `scripts/load-lane-classify.py` -- this path is under `mudlib/**`, which
#     is runtime-relevant. Bumping `rev` therefore takes a load-lane place and
#     gets measured, exactly like a `Cargo.lock` bump.
#   * `loom-loadtest --note` -- the resolved `repository@rev` is stamped into
#     every report this job writes (`results/ci-e1-1.json`/`.md` and the
#     uploaded artifact), so a number always names its mudlib.
#
# How to bump it. Put the *full 40-character commit SHA* -- lowercase, exactly as
# `git rev-parse` prints it, because the job compares against that -- of the warp
# commit you want measured in `rev`. Never a branch or tag name: a name can move
# underneath a run, which is the failure this file exists to prevent. Bump it in
# its own PR (or a PR that clearly intends it), because the run that follows is
# measuring a different world than the reports in `results/`. Keep the pinned
# commit reachable from warp's default branch, and say which warp PR it came
# from in the commit message so the archaeology is one hop, not a search.

repository=LoomMud/warp
rev=1b0cd394d4cd41586e1a2d5fd449786b75c96976
