name: ci
on:
  pull_request:
    # Only the activity types that change what is being measured. GitHub runs
    # `pull_request` workflows for *every* type when this is omitted, so a
    # label, a reviewer request or a title edit used to start a whole new CI
    # run and take a fresh lane place for a diff that did not change -- and
    # with the workflow-level cancel below, it would now also cancel that PR's
    # in-flight 150-player measurement. `opened` and `synchronize` stay, so a
    # required check still runs on the first commit and on every commit after
    # that one; `reopened` stays because a reopened PR has no live run.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # ── The drift backstop (OBI-326) ──────────────────────────────────────────────
  # After OBI-325 a run only takes a place in the load lane when its diff can move
  # the numbers, so a long stretch of irrelevant merges can leave `main`
  # unmeasured -- and the world under test now changes on *warp's* schedule, when
  # `warp.ref` is bumped, not on yours. These two triggers carry no commit range,
  # so `classify` falls closed to `runtime=true` (an unreadable or absent range is
  # never evidence that nothing changed: see scripts/load-lane-classify.py) and the
  # run measures.
  #
  #   schedule          one measurement of `main` against the pinned world every
  #                     day, so drift lands on a date instead of on whoever's PR
  #                     happens to get measured next. GitHub only fires scheduled
  #                     workflows on the default branch, which is exactly the
  #                     branch this backstop is for; the minute is off the hour so
  #                     we are not queuing behind every other repo's midnight run.
  #   workflow_dispatch the on-demand measurement a release needs. The release
  #                     policy in results/README.md requires a green,
  #                     *measured* `loadtest-e1-1` for a release SHA, and the
  #                     candidate for that SHA may well be a diff the classifier
  #                     correctly skipped. Dispatch is how you get the number
  #                     without inventing a commit to force a lane run.
  #
  # Neither of them is cancellable, and neither may cancel: rule 5 keeps the
  # workflow-level group on `github.run_id` for any non-`pull_request` event with
  # `cancel-in-progress` false, so a nightly run can never kill an in-flight gate
  # and a force-push cannot kill the nightly measurement. Rule 12 asserts both
  # triggers are still here -- a backstop that can be deleted through `.github/**`
  # (which the classifier counts irrelevant) is a comment, not a backstop.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read

# ── Which runs may be cancelled, and which may never be (OBI-313) ─────────
# The rule, as accepted by the CTO on 2026-10-08: no required check on a
# MERGEABLE CANDIDATE may be cancelled. A mergeable candidate is the commit
# branch protection actually evaluates -- for a pull request, its newest
# commit, because `strict: true` ("require branches to be up to date before
# merging") means a stale SHA never satisfies the branch anyway. A superseded
# PR SHA is therefore not a mergeable candidate, so cancelling it is permitted;
# everything else is not.
#
# MAY BE CANCELLED -- a `pull_request` run whose commit is already superseded
# by a newer push to the same PR. That is the only thing this block cancels.
# It exists because `loom-ci-load-lane` is a FIFO across runs: a PR with three
# pushes holds three places in it, and nobody else's required gate moves until
# they drain. Run 37698132725 (2026-10-07 22:44:59Z) was a *draft* PR whose
# diff was two README paragraphs and a comment block; it held a lane place for
# `loadtest-e1-1` -- and, on the branch where OBI-311's CPU-heavy jobs join the
# lane, for `rust` and the three `fuzz-smoke*` jobs too -- and had to be
# cancelled by hand 43 s later. Draft state does not suppress `pull_request`
# runs in this repo, and suppressing them with a job-level `if:` would *skip* a
# required check -- and GitHub counts a skipped required check as **passing**, so
# that draft would go green having measured nothing. (The OBI-325 review found the
# same fail-open in the classifier path; `loadtest-e1-1` now runs
# `if: ${{ !cancelled() }}`, and rule 4 pins that exact expression.) Cancelling a run that
# is already superseded is the control we have -- which is also why the trigger
# above is narrowed to the commit-changing activity types: a label is not a
# superseded commit, and must not be able to kill a running gate.
#
# NEVER CANCELLED -- a PR's newest commit (a mergeable candidate), a `push` to
# `main`, and any measurement already running.
# For a non-`pull_request` event the group falls back to `github.run_id`, so
# every main push is its own group and there is nothing for a later run to
# cancel: OBI-311's "5 sequential un-retried E1.1 runs" stays measurable. The
# lane jobs keep `cancel-in-progress: false` and `queue: max` so a gate is not
# killed inside its own run either -- a workflow-level cancel does reach into
# jobs whose own `cancel-in-progress: false` forbids it, which is why
# scripts/check-ci-load-lane.py pins both the group and this expression rather
# than trusting a comment above them.
#
# What cancellation costs: the check on the superseded commit ends `cancelled`
# and the newer commit is measured again, so a PR gets one live E1.1
# measurement instead of one per push. Nothing measured on a mergeable candidate
# is lost, because the newest commit is always the survivor of the cancel. The
# narrowing of `on.pull_request.types` above is what keeps that true: an event
# that does not change the commit must never be able to kill the gate running on
# the mergeable candidate. Rules 5-6 of scripts/check-ci-load-lane.py pin both
# the shape of this block and the trigger, and `results/README.md` states the
# policy this comment is summarising.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── CI load lane (OBI-308) ─────────────────────────────────────────────────
# `loadtest-e1-1`, `loadtest-smoke` and `bench` measure wall-clock latency on
# the self-hosted runner set (`vars.CI_RUNS_ON` -> `arc-runner-set-loommud`).
# A second run on that host makes their numbers meaningless, not wrong: on
# 2026-10-07 two E1.1 runs sharing one host reported p50 76 ms / p99 593 ms /
# max 784 ms against the 50 ms SLA, with 0 login failures and 0 disconnects
# (runs 37658696127 and 37658252388) on a commit whose only change was a test
# file, while the same commit passed every other job. Contention, not a
# regression.
#
# So these three jobs share the job-level concurrency group
# `loom-ci-load-lane`, with:
#   cancel-in-progress: false -- never kill a measurement already running; and
#   queue: max               -- pending runs wait in FIFO instead of the
#                               default `single`, where a third run cancels the
#                               pending one. A *cancelled* required check
#                               blocks a PR exactly like a failed one, so
#                               queueing is part of "don't weaken the gate".
# They are also chained with `needs` -- loadtest-e1-1 -> loadtest-smoke ->
# bench -- so the three never overlap inside one run either. The required gate
# goes first in the chain: nothing may skip it or make it optional, and the one
# permitted `needs:` on it is `classify`, the OBI-325 job below that decides
# whether this diff has to be measured at all -- permitted because rule 8 of
# scripts/check-ci-load-lane.py proves `classify` cannot be skipped and cannot
# fail-open, and it has no `if:` of its own. `rust`/`deny`/`dco`/`hygiene` (the
# other required checks) stay outside the lane and unscheduled so they can never
# be skipped by a lane job.
# Each gate also carries wall-clock headroom (`timeout-minutes` 30 / 20): the
# lane stops a second *gate* from racing, not this run's own `rust` job or
# another PR's builds, and a release build starved past the old 15-minute
# budget ends the required check as `cancelled` (run 37663331238, 2026-10-07)
# -- as blocking as a miss, and with no p99 number to read.
#
# Residual: GitHub scopes a job-level concurrency group per workflow *and job*,
# so the hard guarantee is "the same gate never runs twice at once across
# PRs". One PR's `bench` can still land on the host while another PR's E1.1
# measures; that shows up as a bench blip, not a false E1.1 SLA miss. Fixing
# it properly is runner capacity (ephemeral/dedicated load hosts), deliberately
# out of scope for OBI-308 -- see results/README.md "CI load lane".
#
#
# ── Who has to wait at all (OBI-325) ──────────────────────────────────────────
# A lane place is only worth waiting for if the run can change what the lane
# measures. `loadtest-e1-1` builds `cargo build --release -p loom-cli
# -p loom-loadtest` from the checkout and drives `loom serve --mudlib warp` over
# telnet, so the inputs are the two binaries' source, their manifests and
# feature sets, the lockfile, the toolchain, `.cargo/` config, and the mudlib.
# The `classify` job below decides that with `scripts/load-lane-classify.py` --
# an *irrelevance allow-list with a fail-closed default*, because a path nobody
# thought of costs one lane run while the opposite mistake costs an unmeasured
# regression -- and the three lane jobs read its verdict twice:
#
#   * `concurrency.group` -- runtime-relevant (or undecided) takes
#     `loom-ci-load-lane`; runtime-irrelevant takes a `github.run_id`-scoped
#     group, which no other run is in, so a docs or test PR cannot be queued
#     behind somebody else's 150-player measurement;
#   * the measurement steps' `if:` -- the same test, so an escaped group also
#     means nothing runs on the host: the job is checkout + summary.
#
# Two edges of that table are easy to get backwards, so they are cases in the
# classifier's own --self-test: `crates/*/tests/fixtures/**` is the in-repo
# mirror of `warp/loadbot/mix.tsv`, the mix E1.1 replays at runtime (it is *not*
# compiled in -- `src/mix.rs`'s `include_str!` is `#[cfg(test)]`-only, as the
# OBI-327 review pointed out), which is what makes a path under tests/ relevant
# while the test code around it is not; and bench workloads and harness files are
# relevant because `bench` measures them inside this same lane, and skipping
# would silently retire the only bench regression gate. The one input that lives
# in a *second* repository -- the `warp` mudlib the gate serves -- is pinned in
# `warp.ref` (OBI-326) and read by the `warp-pin` step in each load job,
# so it is classified from a path the lane counts (`mudlib/**`) and a bump takes
# a lane place like a `Cargo.lock` bump does. Before that the checkout floated on
# warp's default branch: a warp-side change could move p99 while every loom PR
# skipped the lane, and no committed number named the mudlib that produced it.
#
# `.github/**` itself is on the irrelevant list, and that is only honest because
# of rule 9 of scripts/check-ci-load-lane.py: no job may install a `toolchain:`
# that rust-toolchain.toml does not declare. The compiler is an input the lane
# measures, so it gets exactly one place to change -- a file the classifier
# counts as runtime-relevant -- and a workflow-only bump fails `hygiene` (a
# required check) instead of quietly redefining what every later run builds.
#
# Both are keyed on `!= 'false'` and not on `== 'true'`: an empty or unreadable
# classifier output then means "take the lane and measure", never "skip". That
# is what keeps the required gate fail-closed while the check still reports a
# real conclusion (the job is never `if:`-ed away, and a *skipped* required
# check blocks a PR exactly like a failed one -- see the draft-PR note above).
# On the skip path the job writes a summary saying the green is "not
# applicable", not "measured", which is the whole point of keeping the check.
#
#
# ── Who has to wait, stage two: ask the compiler (OBI-397) ─────────────────────
# A table of paths is hand-maintained, so it can only speak about *files*. On
# `crates/*/src/**` its answer is "driver or load-bot source" whether the commit
# rewrites the scheduler or adds a doc comment -- and a PR that touches a
# `#[cfg(test)]` module under `src/` cannot be lane-skipped, because the
# allow-list would then allow-list the whole of the driver. That is not
# hypothetical: the sample week in results/2026-10-09-load-lane-before-after.md
# has 38 PR runs holding a lane place, 21 of them (70.3 of 110.0 lane minutes)
# carried by source alone, and the one that prompted this -- PR #160, six files,
# 1289 added lines, all test harness or dead code -- waited six lane places for
# a measurement of a binary it had not changed.
#
# So the lane-verdict diffs that are *purely* source get a second stage, and it
# is not another guess. `loadtest-e1-1` runs exactly two programs, built by
# exactly one command. `scripts/load-lane-identity.py` runs that command at the
# merge base and at the PR head and compares the SHA-256 of both artefacts:
# identical bytes means the 150-player run would measure the same program that
# already has a recorded p99, so there is nothing to learn from the lane. This
# is the compiler's own answer instead of a model of it: `#[cfg(test)]` code,
# doc comments, macros, generics that were never instantiated and dead code the
# optimiser removes all come out of the artefact, and no `#[cfg(test)]` span
# parser has to be right the first time.
#
# What the hash is allowed to speak for is decided by the table itself, not a
# second list: stage two may ask only when, after dropping every path the table
# already waves through, what remains is `crates/*/src/*.rs`. That leaves
# `Cargo.lock`/`Cargo.toml`/`.cargo/`/`rust-toolchain.toml` (what gets compiled),
# `warp.ref` and `mudlib/**` (what the *driver reads* -- a bump there moves p99
# with byte-identical binaries, which is exactly the hole OBI-326 closed), and
# `crates/*/benches/*.rs`, `scripts/bench-gate.sh`, `scripts/bench_compare.py`
# (a *different* measurement sharing this lane) permanently in stage one's hands.
#
# Where the proof came from matters as much as the proof, so the `classify` job
# carries it: same toolchain pin, same `Swatinem/rust-cache`, same build command
# string as `loadtest-e1-1` (rules 12 and 13 of `scripts/check-ci-load-lane.py`
# diff those three against the gate's own steps, so the proof cannot drift away
# from what it claims to predict). The job's verdict is the *merge* of the two
# stages and the merge is one-directional: a matching hash can downgrade
# "relevant" to "skip", and nothing can upgrade a skip. Every non-answer --
# build failure, timeout, dirty tree, unreadable range, a dead proof step --
# says `same=false` and the lane is taken, and the `verdict` step is the last
# step with no `if:` so the outputs are always written rather than skipped.
#
# These invariants are enforced by scripts/check-ci-load-lane.py, run in the
# `hygiene` job below -- rule 8 there pins the escape hatch, both copies of it,
# and the fail-closed comparison. Which runs may be cancelled *at all* is the
# workflow-level `concurrency` block above, not anything in the lane.
jobs:
  rust:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loom_superuser
          POSTGRES_PASSWORD: loom_superuser_ci_only
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom_superuser -d loom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # loom-persist (D-27.4): migrations never create logins or contain
      # passwords. CI creates both logins below, as a setup step, using the
      # Postgres service's superuser. loom_owner owns every table/function
      # and runs migrations (LOOM_DB_MIGRATE_URL); loom_app is the
      # world-runtime login under test and is not an owner (DATABASE_URL).
      #
      # OBI-151: the `loom-cli`/`loom-persist` integration tests read
      # LOOM_TEST_DB_MIGRATE_URL/LOOM_TEST_DATABASE_URL, not the ambient
      # LOOM_DB_MIGRATE_URL/DATABASE_URL names (those are reserved for the
      # real `loom migrate`/`loom serve` entrypoints and, on an agent's own
      # shell, DATABASE_URL is Paperclip's control-plane DB -- OBI-150).
      # CI's Postgres service is neither ambient nor shared, so it is safe
      # to point both sets of variables at the same service container.
      LOOM_DB_MIGRATE_URL: postgres://loom_owner:loom_owner_ci_only@localhost:5432/loom
      DATABASE_URL: postgres://loom_app:loom_app_ci_only@localhost:5432/loom
      LOOM_TEST_DB_MIGRATE_URL: postgres://loom_owner:loom_owner_ci_only@localhost:5432/loom
      LOOM_TEST_DATABASE_URL: postgres://loom_app:loom_app_ci_only@localhost:5432/loom
      # D-27.7: fail (not skip) DB-backed tests when the DB env isn't set.
      LOOM_REQUIRE_DB: "1"
      # Compile-time sqlx query! checks use the committed .sqlx cache; the
      # schema doesn't exist yet at build time (migrations run inside the
      # loom-persist tests themselves, at runtime, via run_migrations).
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-ensure-tools.sh cc:build-essential psql:postgresql-client
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-27)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Create loom_owner and loom_app logins
        run: |
          PGPASSWORD=loom_superuser_ci_only psql -h localhost -U loom_superuser -d loom -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE loom_owner LOGIN PASSWORD 'loom_owner_ci_only';
          CREATE ROLE loom_app LOGIN PASSWORD 'loom_app_ci_only';
          ALTER DATABASE loom OWNER TO loom_owner;
          GRANT ALL ON DATABASE loom TO loom_owner;
          SQL
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast`: cargo aborts the remaining test targets at the first
      # failing one, so one broken crate silently hides the verdict of every
      # crate after it -- OBI-317's first run died in a loom-cli test and never
      # reached loom-lsp, which made that change's CI result unobservable. The
      # job still goes red on any failure; this only makes all of them visible
      # in one run instead of one per iteration.
      - run: cargo test --workspace --no-fail-fast
  bench:
    # VM benchmark regression gate (OBI-25 / OBI-118 / OBI-312): this PR's
    # base vs its working tree, same runner, >15% on any workload fails.
    # Method: crates/loom-vm/benches/BASELINE.md. Deliberately NOT a required
    # check (no release cadence to re-baseline against yet).
    #
    # Load-lane member (OBI-308): criterion timings are as sensitive to a noisy
    # neighbour as E1.1's p99, so it waits for the lane and runs after the two
    # loadtest jobs rather than alongside them. `success()` keeps the default
    # `needs` semantics -- the event condition alone would run bench even when
    # the lane jobs were skipped.
    #
    # OBI-312: this gate failed PR #131 with priv_control at ratio 1.177 on a
    # diff with no `.rs` in it, and the two arms turned out to build
    # *byte-identical* `vm_bench` binaries. A two-arm gate cannot tell "the
    # code got slower" from "the runner moved", so it reported a measurement
    # artifact as a code regression. It now runs a third arm -- a
    # byte-identical copy of the head binary -- and exits 3 (`INVALID
    # harness`) when that control fails to measure 1.00. Threshold, rounds,
    # iterations and the workload list are unchanged.
    #
    # OBI-325: it asks `loadtest-smoke` for the lane verdict rather than
    # recomputing one, so the three lane jobs cannot disagree about whether a
    # run occupies the lane.
    needs: loadtest-smoke
    if: github.event_name == 'pull_request' && success()
    outputs:
      runtime: ${{ needs.loadtest-smoke.outputs.runtime }}
      reason: ${{ needs.loadtest-smoke.outputs.reason }}
    concurrency:
      group: ${{ needs.loadtest-smoke.outputs.runtime != 'false' && 'loom-ci-load-lane' || format('loom-ci-load-lane-not-required-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    # ~2m02s for the gate step on the lane host (run 37702660820, 23:48:46 ->
    # 23:50:48: two builds + 3 rounds x 3 arms), i.e. ~5 min of job wall time
    # with checkout and the toolchain. That host is not the "2-vCPU runner" the
    # OBI-118 prose assumed: meta.env in the bench-rounds artifact measures an
    # i7-6700T container, 8 CPUs visible, no cgroup CPU quota, cpufreq governor
    # `powersave`, load average 4.98 at gate start. Headroom so host load can
    # only make the gate slow, never hang the lane. Keep this value distinct
    # from the loadtest gates' 20/30: the check-ci-load-lane self-test mutates
    # the first `timeout-minutes: 30` in the file, which must stay
    # loadtest-e1-1's.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: scripts/ci-ensure-tools.sh cc:build-essential python3:python3-minimal
        if: needs.loadtest-smoke.outputs.runtime != 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-27)
        if: needs.loadtest-smoke.outputs.runtime != 'false'
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.loadtest-smoke.outputs.runtime != 'false'
      - run: scripts/bench-gate.sh "${{ github.event.pull_request.base.sha }}"
        if: needs.loadtest-smoke.outputs.runtime != 'false'
      - name: Upload raw round data
        # The verdict is a min-of-medians; OBI-312 could not be diagnosed from
        # CI because the per-round numbers were thrown away. Keep them.
        if: always() && needs.loadtest-smoke.outputs.runtime != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-rounds-${{ github.run_id }}
          path: target/bench-gate/logs/
          if-no-files-found: warn
  deny:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources advisories
  dco:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: DCO sign-off
        # Check only the commits this event introduces. On push, a scan of all
        # history would re-flag commits already on main (OBI-57). A zero or
        # unknown `before` (new branch / force push) falls back to HEAD.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-dco.sh "$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/check-dco.sh "$BEFORE..$AFTER"
          elif git rev-parse -q --verify "$AFTER^" >/dev/null 2>&1; then
            # No readable change range: a scheduled or dispatched run, or a push whose
            # `before` is gone. Audit the commit this run is standing on, and only that.
            # The fallback used to be `scripts/check-dco.sh HEAD`, which walks the *whole*
            # history, and this repository's history contains commits authored by the
            # founder and signed off by the agent who wrote them (a1d3dc4, 7f1b074 --
            # author `Greg Oberfield`, trailer `Signed-off-by: Gimli`). The rule compares
            # the trailer to the author, so that scan fails on the same two commits every
            # single time. A nightly that is red by construction is not a drift backstop,
            # it is noise people learn to skip -- and whether an agent's sign-off satisfies
            # DCO for a human-authored commit is a policy call for the CTO, not something
            # a scheduled run should be re-litigating on old merged history.
            scripts/check-dco.sh "$AFTER^..$AFTER"
          else
            scripts/check-dco.sh "$AFTER"
          fi
  hygiene:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          workdir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$workdir"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$workdir/gitleaks.tar.gz"
          tar -xzf "$workdir/gitleaks.tar.gz" -C "$workdir" gitleaks
          "$workdir/gitleaks" git --redact --exit-code 1 .
      - name: CI load lane invariants (OBI-308, workflow-level cancel OBI-313, lane escape OBI-325, mudlib pin OBI-326, lane identity OBI-397)
        # The latency gates in this workflow are only meaningful on a quiet
        # host. Keep the lane (concurrency group + DAG order + "no required
        # check may be skipped") from rotting silently, and keep the
        # workflow-level group cancelling superseded `pull_request` runs only:
        # a workflow-level cancel reaches into jobs whose own
        # `cancel-in-progress: false` forbids it. Rule 11 also reads
        # `warp.ref` here, so the world the gate serves cannot stop
        # being pinned without failing a required check.
        run: |
          set -euo pipefail
          scripts/ci-ensure-tools.sh python3:python3-minimal
          python3 scripts/check-ci-load-lane.py .github/workflows/ci.yml
          python3 scripts/check-ci-load-lane.py --self-test .github/workflows/ci.yml
      - name: load-lane classifier self-test (OBI-325)
        # *Which* diffs may skip the lane is a policy decision about what the
        # gate measures, so it lives in a table -- and the table is tested here,
        # not in the lane, where a wrong answer costs 40 minutes to notice. The
        # cases are the real diffs from the case studies plus the overlaps that
        # are easy to get backwards (`tests/fixtures/**` mirrors the mix the gate
        # replays, so it is relevant even though it lives under `tests/`), and
        # every unrecognised or unreadable diff must come out
        # runtime-relevant.
        run: |
          set -euo pipefail
          scripts/ci-ensure-tools.sh python3:python3-minimal
          python3 scripts/load-lane-classify.py --self-test
      - name: load-lane identity proof self-test (OBI-397)
        # Stage two's table is small, but the properties it depends on are not
        # visible from the workflow: every undecided path must come out
        # `same=false`, and the tree must be handed back the way it was found --
        # a `classify` job that leaves HEAD parked on the merge base would feed
        # the next step in the same job the wrong program. Cheap here, expensive
        # to notice in the lane, where the wrong answer is a green check over an
        # unmeasured regression.
        run: |
          set -euo pipefail
          scripts/ci-ensure-tools.sh python3:python3-minimal
          python3 scripts/load-lane-identity.py --self-test
      - name: bench gate comparator self-test (OBI-312)
        # The `bench` job's exit code decides whether a red gate means "this
        # code got slower" (1) or "the harness cannot measure 1.00" (3). That
        # classification is testable without any release build, so test it
        # here on synthetic round logs instead of in the lane under load.
        run: |
          set -euo pipefail
          scripts/ci-ensure-tools.sh python3:python3-minimal
          python3 scripts/bench_compare.py --self-test
      - name: lsp thread-count guard isolation (OBI-317)
        # tests/lsp_thread_count.rs measures /proc/self/task, a *process-wide*
        # thread list. The number only means "one LSP session did not leak"
        # while that binary hosts exactly one session, so a second #[test] in
        # it re-creates the flake the file exists to remove (sibling sessions
        # starting/stopping in the measurement window). No runtime assertion can
        # tell "the harness grew" from "a sibling session appeared", so the
        # rule is checked where it is unambiguous: statically, in the lane.
        run: |
          set -euo pipefail
          f=crates/loom-lsp/tests/lsp_thread_count.rs
          if [ ! -f "$f" ]; then
            echo "$f is missing: the G1/M-LSP-4 thread-count guard needs its own test binary" >&2
            exit 1
          fi
          n=$(grep -c '^#\[test\]' "$f" || true)
          if [ "$n" != 1 ]; then
            echo "$f must contain exactly one #[test] (found $n). Its thread-count" >&2
            echo "measurement is process-wide, so a sibling session in the same binary" >&2
            echo "makes it flaky (OBI-317). Put the new test in lsp_integration.rs." >&2
            exit 1
          fi
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5.0.0
  fuzz-smoke:
    # Weft parser fuzz smoke (OBI-23): <= 60 s of libFuzzer seeded from the
    # golden files. Not (yet) a required check on `main`.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-ensure-tools.sh cc:build-essential c++:build-essential
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly (2026-09-27)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/loom-syntax/fuzz
      - run: cargo install cargo-fuzz --locked
      - run: FUZZ_SECONDS=45 scripts/fuzz-smoke.sh parse
  fuzz-smoke-bytecode:
    # Bytecode verifier fuzz smoke (OBI-30): decode+verify, <= 60 s of
    # libFuzzer. Not (yet) a required check on `main`.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-ensure-tools.sh cc:build-essential c++:build-essential
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly (2026-09-27)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/loom-compiler/fuzz
      - run: cargo install cargo-fuzz --locked
      - run: FUZZ_SECONDS=45 scripts/fuzz-smoke.sh bytecode
  fuzz-smoke-lsp:
    # loom-lsp request-handler fuzz smoke (OBI-168, spec M-LSP-4): <= 60 s
    # of libFuzzer over arbitrary (offset, source) pairs. Not (yet) a
    # required check on `main`.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-ensure-tools.sh cc:build-essential c++:build-essential
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly (2026-09-27)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/loom-lsp/fuzz
      - run: cargo install cargo-fuzz --locked
      - run: FUZZ_SECONDS=45 scripts/fuzz-smoke.sh lsp
  web-client:
    # The web client (OBI-39 player page, OBI-165 admin console, OBI-180 IDE
    # shell): build + unit tests, an npm licence gate mirroring
    # `deny.toml`'s OSI allow-list, the supply-chain and CSP audits the IDE
    # added a browser-side dependency surface for.
    #
    # Order matters: `build` stages Monaco out of the lockfile and fails on a
    # version mismatch, `lint` audits the source *and* the manifest that step
    # just produced, and `test` runs the compiled output.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # `npm ci`, not `npm install`: OBI-180 M-IDE-3 makes the lockfile the
      # pinned source of truth for what runs in a builder's browser, which is
      # only true if CI installs exactly it. `--include=dev` is spelled out
      # rather than left to the default -- the type-checker, ESLint, and
      # license-checker are devDependencies, and an `omit=dev`/`NODE_ENV=
      # production` runner would otherwise turn "lint passed" into "lint
      # never ran".
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # The audit gate's own gate: `check-static-csp.mjs` is the CI half of
      # M-IDE-1 for documents served outside the Rust `ServeDir` wiring, so a
      # broken scanner has to fail loudly instead of passing vacuously.
      - run: node --test ../scripts/check-static-csp.test.mjs
      - run: npm run check-licenses
      # `--audit-level=high`, but *not* `--omit=dev`: CI installs devDeps and
      # audits them, which is how PR #141's first run caught a HIGH chain
      # (`typescript-eslint` -> `fast-glob` -> `micromatch` -> `braces`) that a
      # local run with `omit=dev` in npm's config had passed clean. The dev
      # graph is the supply-chain surface that ends up executing at build time,
      # so it belongs in the gate; `npm run audit` spells `--include=dev` out
      # so no runner's config can narrow it silently.
      - run: npm run audit
  classify:
    # OBI-325: decide whether this change can move the numbers the load lane
    # measures *before* any job takes a place in that lane.
    #
    # Why it has to be a separate job: GitHub resolves a job-level
    # `concurrency.group` when the job is scheduled, so the answer has to exist
    # before `loadtest-e1-1` asks for the lane -- a step inside that job is
    # already 35-60 minutes of queue too late. `needs` is an allowed context for
    # `jobs.<job_id>.concurrency`, which is what makes this shape possible.
    #
    # This job is not a required check and must never be able to *skip* one, so
    # it is built to fail toward the lane instead: it has no `needs:`/`if:` of
    # its own, the classifier writes exactly one `runtime=` line and exits 0 on
    # every path, and if anything at all goes wrong (no diff range, no python,
    # a crash) the fallback value written here is `true` -- "take the lane and
    # measure". A classifier that cannot decide delays merges; it does not
    # silently wave a regression through.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    # The proof is two release builds (about 50 s warm each, and a cold workspace
    # is under 4 min), so the budget is 2 x the script's own 900 s per-build cap
    # plus setup. The cap inside the script must fire first -- rule 13 pins it --
    # because a job that Actions kills writes no output, `runtime` comes out empty,
    # and the gate takes the lane. That is the right *direction*, but it is a
    # warning-free way to spend 30 minutes of someone's queue on a diff the
    # compiler could have cleared in 40 seconds.
    timeout-minutes: 45
    outputs:
      runtime: ${{ steps.verdict.outputs.runtime }}
      reason: ${{ steps.verdict.outputs.reason }}
      files: ${{ steps.decide.outputs.files }}
      # Diagnostics only: no job reads these, and nothing may `needs:` them --
      # the merge below is the only place a stage-two answer is allowed to
      # change what the lane does.
      identity_scope: ${{ steps.decide.outputs.identity }}
      identity_proof: ${{ steps.prove.outputs.same }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The classifier diffs `base...head`, so it needs both ends and their
          # merge base. `hygiene` and `dco` already pay for a full clone; this
          # is the same cost, not a new one.
          fetch-depth: 0
      - run: scripts/ci-ensure-tools.sh python3:python3-minimal
        # Tolerated on purpose: a runner that cannot apt-install python3 must not
        # fail this job. The gate now runs even when this job does not
        # (`if: ${{ !cancelled() }}`), so a dead classifier costs a lane place and a
        # full measurement for a diff that may not need one -- expensive, not
        # dangerous, and never a silent green. The fallback below writes the verdict.
        continue-on-error: true
      - name: classify the diff
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          verdict="$RUNNER_TEMP/load-lane.out"
          : > "$verdict"
          # One invocation, one verdict file: `runtime=` may be written at most
          # once, so the fallback below can never sit beside a real answer.
          args=(--reason "$EVENT carries no readable commit range")
          if [ "$EVENT" = pull_request ]; then
            # Three-dot on purpose: this PR's own files, not whatever `main` moved
            # by while the gate was queued. Two-dot would let someone else's `src/`
            # change make a docs PR runtime-relevant.
            args=(--range "$PR_BASE...$PR_HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            args=(--range "$BEFORE...$AFTER")
          fi
          python3 scripts/load-lane-classify.py "${args[@]}" \
            --output-file "$verdict" --summary || true
          if ! grep -q '^runtime=' "$verdict" 2>/dev/null; then
            echo 'runtime=true' >> "$verdict"
            echo 'reason=the classifier could not answer (fail closed: take the lane)' >> "$verdict"
            echo "::warning::load-lane classifier produced no verdict; taking the lane"
          fi
          cat "$verdict" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          cat "$verdict" || true
          # This job must not fail *instead of answering*. It used to matter
          # because a failed `classify` skipped `loadtest-e1-1`, and a *skipped*
          # required check is counted as passing -- a green with no measurement.
          # `loadtest-e1-1` runs `if: !cancelled()` now, so that hole is
          # closed at the gate instead of depending on this exit code. What is left
          # is the economics: an undecided diff must fail *toward* the lane (the
          # fallback above writes `runtime=true`), and the warning is what makes
          # that cost visible instead of silent.
          exit 0
      # ── stage two (OBI-397): put the question to the compiler ──────────────
      # Three steps that only exist for a *lane-verdict that is pure source* on a
      # pull request, and every one of them is tolerated: a proof that cannot run
      # writes no `same=true`, which the merge below reads as "not proven, so
      # measure". `main` pushes are excluded by the `if:` and by rule 8 -- the
      # Phase 1 exit criterion wants a real p99 per release, and a merge to main
      # is where a regression has to land, so the last word on a push is never a
      # 40-second build on a different checkout.
      - name: identity proof build tools
        # The lane runner image is not a build image. Without this step the
        # proof's first `cc` call dies (`error: could not compile `libc` (build
        # script)` -- the first live run of stage two, PR #175's `classify` job
        # 113823165936, is what proved it). The proof returns `same=false`, which
        # is safe, and permanently so: a stage two that can never say
        # "identical" is a stage two that was never installed. This is the
        # *gate's own* invocation, and rule 14 requires the two strings to match,
        # because an environment that builds differently hashes a different
        # program.
        if: ${{ steps.decide.outputs.runtime == 'true' && steps.decide.outputs.identity == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: scripts/ci-ensure-tools.sh cc:build-essential python3:python3-minimal
      - name: identity proof toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-27)
        if: ${{ steps.decide.outputs.runtime == 'true' && steps.decide.outputs.identity == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          # Pinned, and rule 12 compares this string with the gate's own step: a
          # proof built by a different rustc predicts nothing about the binary
          # E1.1 measured.
          toolchain: "1.98.1"
      - name: identity proof build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.decide.outputs.runtime == 'true' && steps.decide.outputs.identity == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
      - name: prove the release build is unchanged
        id: prove
        if: ${{ steps.decide.outputs.runtime == 'true' && steps.decide.outputs.identity == 'true' && github.event_name == 'pull_request' }}
        env:
          # `base.sha` and `github.sha`: the *merge commit the run is
          # measuring*, not `pull_request.head.sha`. E1.1 builds and drives
          # this checkout, so "identical to the merge base" has to be said
          # about the tree E1.1 will actually test -- and the merge commit is
          # what `actions/checkout` leaves in HEAD, which is the provenance the
          # script insists on.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -uo pipefail
          # No `--offline`: the gate's build step does not use it either, and the
          # proof has to fail the same way the thing it predicts would.
          # 1980 = 2 x the script's own 900 s per-build cap + 3 min of slack, and
          # less than this job's 45 min (rule 13). Whichever fires first the answer
          # is "not proven", which takes the lane.
          timeout -k 30 1980 python3 scripts/load-lane-identity.py \
            --base "$BASE" --head "$HEAD" --output-file "$GITHUB_OUTPUT" --summary \
            || echo 'same=false' >> "$GITHUB_OUTPUT"
          echo "identity proof: $(grep '^same=' "$GITHUB_OUTPUT" 2>/dev/null || echo 'same=false')"
          exit 0
      - name: verdict
        id: verdict
        env:
          TABLE_RUNTIME: ${{ steps.decide.outputs.runtime }}
          TABLE_REASON: ${{ steps.decide.outputs.reason }}
          SCOPE: ${{ steps.decide.outputs.identity }}
          SAME: ${{ steps.prove.outputs.same }}
          PROOF_REASON: ${{ steps.prove.outputs.reason }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          runtime="$TABLE_RUNTIME"
          reason="$TABLE_REASON"
          # One direction only. A byte-identical release build may clear the lane
          # for a diff the table could not decide; nothing here can turn a table
          # "skip" into a measurement, because that verdict is already the
          # cheaper-and-safer answer. `[ "$SAME" = true ]` is the whole proof: an
          # absent output (no python, dead step, capped build, failed checkout)
          # is not `true`, so the lane is taken.
          if [ "$EVENT" = pull_request ] && [ "$SCOPE" = true ] \
             && [ "$runtime" != false ] && [ "$SAME" = true ]; then
            runtime=false
            reason="stage two: $PROOF_REASON"
          fi
          { echo "runtime=$runtime"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "load-lane verdict: runtime=$runtime ($reason)"
          exit 0

  loadtest-smoke:
    # R4 load-bot smoke (OBI-40): 20 simulated players, 60s, against a real
    # `loom serve` on this checkout's fixture mudlib driven by Warp's
    # loadbot/mix.tsv contract. Not a required check on `main`; the full
    # E1.1 (150 players) and stretch (500 players) runs are done by hand
    # and their reports committed under `results/` (see loom-loadtest's
    # README and OBI-40).
    #
    # Load-lane member (OBI-308): runs after `loadtest-e1-1` in the same group,
    # so it neither contends with the required gate nor with `bench`.
    #
    # OBI-325: it inherits the required gate's lane verdict and republishes it,
    # so `bench` (which needs *this* job) reads the same decision the lane was
    # entered on -- and a runtime-irrelevant run leaves the group immediately
    # instead of queueing behind another PR's measurement.
    needs: loadtest-e1-1
    outputs:
      runtime: ${{ needs.loadtest-e1-1.outputs.runtime }}
      reason: ${{ needs.loadtest-e1-1.outputs.reason }}
    concurrency:
      group: ${{ needs.loadtest-e1-1.outputs.runtime != 'false' && 'loom-ci-load-lane' || format('loom-ci-load-lane-not-required-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/ci-ensure-tools.sh cc:build-essential python3:python3-minimal
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-27)
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
      # OBI-326: the mudlib is an input to the number this gate prints, so the
      # job reads `warp.ref` and checks that exact commit out. There is
      # no fallback here on purpose: an absent, unreadable or branch-named pin
      # fails the gate instead of quietly serving warp's default branch again.
      # Rule 11 of scripts/check-ci-load-lane.py enforces this shape -- and that
      # the pin file is on the classifier's runtime-relevant list -- in
      # `hygiene`, a required check that runs on every PR, so the pin cannot
      # rot into a comment.
      - name: read the pinned mudlib rev
        id: warp-pin
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
        env:
          PIN_FILE: warp.ref
        run: |
          set -euo pipefail
          if [ ! -f "$PIN_FILE" ]; then
            echo "::error::$PIN_FILE is missing: the gate refuses to guess which mudlib to serve"
            exit 1
          fi
          # One payload line: comments and blanks stripped, the SHA, nothing else.
          # The line count is checked, not just the shape: `head -1` would otherwise
          # serve the first of two revs and leave rule 11 to notice -- a gate should
          # fail on the input it was handed, not on a later reader's arithmetic.
          payload=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$PIN_FILE")
          if [ -z "$payload" ]; then
            echo "::error::$PIN_FILE carries no commit SHA (the gate refuses to guess)"
            exit 1
          fi
          if [ "$(printf '%s\n' "$payload" | wc -l)" -ne 1 ]; then
            echo "::error::$PIN_FILE must hold exactly one line -- the commit SHA -- not two worlds"
            printf '%s\n' "$payload" | sed 's/^/  /'
            exit 1
          fi
          rev="$payload"
          if [ "${#rev}" -ne 40 ] || [[ "$rev" =~ [^0-9a-f] ]]; then
            echo "::error::$PIN_FILE must hold one full 40-character lowercase commit SHA, got '$rev'"
            echo '::error::a branch name can move underneath a run, which is what this pin prevents'
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
        with:
          repository: LoomMud/warp
          path: warp
          ref: ${{ steps.warp-pin.outputs.rev }}
      - name: verify the mudlib under measurement
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
        run: |
          set -euo pipefail
          # Re-read the pin file rather than trust the step output above: the
          # gate serves the commit the repository names, and stamps the number
          # it prints with the mudlib that produced it (results/README.md).
          want=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' warp.ref | head -1)
          got=$(git -C warp rev-parse HEAD)
          if [ "$got" != "$want" ]; then
            echo "::error::serving warp@$got while warp.ref pins $want"
            exit 1
          fi
          echo "mudlib: \`LoomMud/warp@$got\` (pinned in \`warp.ref\`)" >> "$GITHUB_STEP_SUMMARY"
      - run: SQLX_OFFLINE=true cargo build --release -p loom-cli -p loom-loadtest
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
      - name: run loom serve + loadtest smoke
        if: needs.loadtest-e1-1.outputs.runtime != 'false'
        env:
          # OBI-344: the same visibility as the gate. The serve log used to be
          # captured at the default level, which prints nothing, so a smoke
          # run carried no server-side evidence at all.
          RUST_LOG: info
          LOOM_SERVE_ERROR_LOG: "1"
        run: |
          set -euo pipefail
          # OBI-344: the save root. It used to not exist in a CI checkout, so
          # `/std/player::save_character` failed with ENOENT once per player
          # and no character ever persisted -- the smoke run never touched the
          # save path. RUNNER_TEMP is run-scoped: nothing is left behind, and
          # nothing here is uploaded.
          SAVES="${RUNNER_TEMP:-/tmp}/loom-saves"
          rm -rf "$SAVES"; mkdir -p "$SAVES"
          ./target/release/loom-cli serve --mudlib warp --save-dir "$SAVES" > /tmp/loom-serve.log 2>&1 &
          echo $! > /tmp/loom-serve.pid
          for i in $(seq 1 50); do
            python3 -c "import socket; socket.create_connection(('127.0.0.1',4000),timeout=1).close()" 2>/dev/null && break
            sleep 0.2
          done
          ./target/release/loom-loadtest \
            --addr 127.0.0.1:4000 \
            --mix warp/loadbot/mix.tsv \
            --players 20 \
            --duration-secs 60 \
            --ramp-per-sec 10 \
            --metrics-url http://127.0.0.1:4001/metrics \
            --out results/ci-smoke \
            --note "mudlib LoomMud/warp@${{ steps.warp-pin.outputs.rev }} (pinned in warp.ref)"
          kill "$(cat /tmp/loom-serve.pid)" || true
          cat /tmp/loom-serve.log
          cp /tmp/loom-serve.log results/loom-serve-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.loadtest-e1-1.outputs.runtime != 'false'
        with:
          name: loadtest-smoke-report
          path: |
            results/ci-smoke.*
            results/loom-serve-smoke.log
  loadtest-e1-1:
    # E1.1 regression gate (150 players, p99 < 50 ms, OBI-177): a required
    # check. Scales up loadtest-smoke's same real `loom serve` + warp mudlib
    # fixture to the full exit-criterion population and fails the build on
    # an SLA miss (`--fail-on-sla-miss`), scraping loom-http's `/metrics`
    # into the uploaded report. See results/README.md for what this job
    # does and does not prove (runner noise vs. the reference-host record).
    #
    # Load-lane holder (OBI-308): the p99 number is meaningless if anything
    # else is on the host, so this job takes the `loom-ci-load-lane` group
    # alone-across-runs (queueing, never cancelling). It carries exactly one
    # `if:` -- `${{ !cancelled() }}` -- because a *skipped* required check counts
    # as passing in GitHub, and a gate that can be skipped by an upstream failure
    # is a gate that can be green without ever measuring.
    #
    # OBI-325: it does have one `needs:`, and that is the whole change. A
    # required check may not be skippable, but it can be *cheap when there is
    # nothing to measure*: `classify` decides, and a runtime-irrelevant diff
    # takes a run-scoped group instead of a lane place and runs no measurement
    # step. The comparison is `!= 'false'`, never `== 'true'`, so an unreadable
    # verdict means "queue and measure"; and the gate is the one that publishes
    # the verdict (`outputs.runtime`) for `loadtest-smoke` and `bench` to
    # inherit, so the three jobs always agree about whether this run holds the
    # lane. Rule 8 of scripts/check-ci-load-lane.py pins both halves of that.
    #
    # `needs:` and `if:` are a pair, and rule 4 checks the pair. Without the
    # `!cancelled()`, a `classify` that dies (lost runner, failed checkout,
    # timeout) leaves this job *skipped*, GitHub reports that as passing, and the
    # PR becomes mergeable with no p99 at all -- the exact hole the OBI-325 review
    # caught. With it, an empty verdict flows through `!= 'false'` and the job
    # takes the lane and measures. `always()` is rejected by rule 4 for a reason:
    # it would start a 150-player run on a host GitHub is already tearing down
    # after a cancel, which produces a number nobody can interpret.
    needs: classify
    if: ${{ !cancelled() }}
    outputs:
      runtime: ${{ needs.classify.outputs.runtime }}
      reason: ${{ needs.classify.outputs.reason }}
    concurrency:
      group: ${{ needs.classify.outputs.runtime != 'false' && 'loom-ci-load-lane' || format('loom-ci-load-lane-not-required-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    # 30, not 15: the lane keeps a second *gate* off the host, but the same
    # run's `rust` job and another PR's build still share it, and a starved
    # release build then blows the budget. When that happened on this PR's
    # first attempt (run 37663331238, 2026-10-07 18:01:00 -> 18:16) the job
    # did not fail, it was *cancelled* at the timeout -- which blocks a PR
    # exactly like a miss and says nothing about p99. A gate that can be
    # cancelled by load is not a gate; slow is survivable, cancelled is not.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Always runs, on both paths: a green check that measured nothing has to
      # say so in the run, not in a comment three weeks later (OBI-325).
      - name: load-lane decision
        env:
          RUNTIME: ${{ needs.classify.outputs.runtime }}
          REASON: ${{ needs.classify.outputs.reason }}
        run: |
          set -uo pipefail
          if [ "$RUNTIME" = false ]; then
            {
              echo '### `loadtest-e1-1`: load lane not required'
              echo
              echo 'Nothing in this diff can change what the E1.1 gate measures, so this'
              echo 'run took no `loom-ci-load-lane` place and made **no measurement**: no'
              echo 'release build, no 150 players, no p99. This check is green because it'
              echo 'is not applicable, not because a latency budget passed.'
              echo
              echo "Rule: \`$REASON\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "loadtest-e1-1: skipped the load lane ($REASON)"
          else
            {
              echo '### `loadtest-e1-1`: measuring in the load lane'
              echo
              echo "Rule: \`$REASON\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "loadtest-e1-1: runtime-relevant ($REASON) -> 150 players, p99 < 50 ms"
          fi
      - run: scripts/ci-ensure-tools.sh cc:build-essential python3:python3-minimal
        if: needs.classify.outputs.runtime != 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-27)
        if: needs.classify.outputs.runtime != 'false'
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.classify.outputs.runtime != 'false'
      # OBI-326: same contract as `loadtest-smoke` -- the mudlib comes from the
      # rev in `warp.ref`, never from whatever warp's default branch
      # points at today, and the report says which mudlib it measured against.
      - name: read the pinned mudlib rev
        id: warp-pin
        if: needs.classify.outputs.runtime != 'false'
        env:
          PIN_FILE: warp.ref
        run: |
          set -euo pipefail
          if [ ! -f "$PIN_FILE" ]; then
            echo "::error::$PIN_FILE is missing: the gate refuses to guess which mudlib to serve"
            exit 1
          fi
          # One payload line: comments and blanks stripped, the SHA, nothing else.
          # The line count is checked, not just the shape: `head -1` would otherwise
          # serve the first of two revs and leave rule 11 to notice -- a gate should
          # fail on the input it was handed, not on a later reader's arithmetic.
          payload=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$PIN_FILE")
          if [ -z "$payload" ]; then
            echo "::error::$PIN_FILE carries no commit SHA (the gate refuses to guess)"
            exit 1
          fi
          if [ "$(printf '%s\n' "$payload" | wc -l)" -ne 1 ]; then
            echo "::error::$PIN_FILE must hold exactly one line -- the commit SHA -- not two worlds"
            printf '%s\n' "$payload" | sed 's/^/  /'
            exit 1
          fi
          rev="$payload"
          if [ "${#rev}" -ne 40 ] || [[ "$rev" =~ [^0-9a-f] ]]; then
            echo "::error::$PIN_FILE must hold one full 40-character lowercase commit SHA, got '$rev'"
            echo '::error::a branch name can move underneath a run, which is what this pin prevents'
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.classify.outputs.runtime != 'false'
        with:
          repository: LoomMud/warp
          path: warp
          ref: ${{ steps.warp-pin.outputs.rev }}
      - name: verify the mudlib under measurement
        if: needs.classify.outputs.runtime != 'false'
        run: |
          set -euo pipefail
          want=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' warp.ref | head -1)
          got=$(git -C warp rev-parse HEAD)
          if [ "$got" != "$want" ]; then
            echo "::error::serving warp@$got while warp.ref pins $want"
            exit 1
          fi
          echo "mudlib: \`LoomMud/warp@$got\` (pinned in \`warp.ref\`)" >> "$GITHUB_STEP_SUMMARY"
      - run: SQLX_OFFLINE=true cargo build --release -p loom-cli -p loom-loadtest
        if: needs.classify.outputs.runtime != 'false'
      - name: capture runner context
        # OBI-344: E1.1 measures wall-clock latency on a *shared* self-hosted
        # runner set, and the lane only guarantees one gate at a time -- the
        # host's other tenants are not in that guarantee. A p99 tail is only
        # interpretable next to what the host was doing, so record it. Read-
        # only probes, no load added; every one degrades to `n/a` rather than
        # failing the gate.
        #
        # OBI-325: gated like every other step that touches the host. On the
        # runtime-irrelevant path the job takes no lane place and reads
        # nothing about it.
        if: needs.classify.outputs.runtime != 'false'
        run: |
          set -uo pipefail
          mkdir -p results
          {
            date -u +"captured_at=%Y-%m-%dT%H:%M:%SZ"
            echo "## uname"; uname -a
            echo "## nproc: $(nproc 2>/dev/null || echo n/a)"
            echo "## loadavg"; cat /proc/loadavg 2>/dev/null || echo "n/a"
            echo "## uptime"; uptime 2>/dev/null || echo "n/a"
            echo "## cgroup v2 cpu.max"; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo "n/a"
            echo "## cgroup v2 cpu.stat (throttling)"; head -6 /sys/fs/cgroup/cpu.stat 2>/dev/null || echo "n/a"
            echo "## cgroup v1 quota/period"; cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us 2>/dev/null || echo "n/a"
            echo "## meminfo"; grep -E "^(MemTotal|MemAvailable|Dirty):" /proc/meminfo 2>/dev/null || echo "n/a"
            echo "## top cpu consumers"; ps -eo pid,comm,%cpu --sort=-%cpu 2>/dev/null | head -12 || echo "n/a"
          } > results/runner-context-before.txt 2>&1
          cat results/runner-context-before.txt
      - name: run loom serve + E1.1 load test (150 players)
        # OBI-325: the guard every host-touching step in this job carries.
        if: needs.classify.outputs.runtime != 'false'
        env:
          # OBI-344: the gate went red on an intermittent p99 tail with no
          # server-side visibility at all -- the serve log was captured at the
          # default level (which prints nothing) and `/metrics` was scraped
          # once, *after* the run, so there was no tick id, no stall counter
          # and no timeline to attribute the tail against. `info` makes the
          # world-thread stall warnings land in the artifact; the error log
          # names the `/std/player` runtime error that every run so far has
          # counted 150 of without ever saying what it is.
          RUST_LOG: info
          LOOM_SERVE_ERROR_LOG: "1"
        run: |
          set -uo pipefail
          # OBI-344: give the run a save root that exists. Every E1.1 run so
          # far recorded `loom_runtime_errors_total{program="/std/player"}
          # = 150` -- one per connected player -- because `save_character`
          # writes to `<mudlib>/saves`, which a fresh checkout does not have.
          # That means the gate has never measured the save path at all; with
          # this line it measures real `save_object` file writes on the world
          # thread, which is the point. RUNNER_TEMP is run-scoped, so nothing
          # is left behind and no save file is ever uploaded.
          SAVES="${RUNNER_TEMP:-/tmp}/loom-saves"
          rm -rf "$SAVES"; mkdir -p "$SAVES"
          echo "save_dir=$SAVES"
          ./target/release/loom-cli serve --mudlib warp --save-dir "$SAVES" > /tmp/loom-serve.log 2>&1 &
          echo $! > /tmp/loom-serve.pid
          for i in $(seq 1 50); do
            python3 -c "import socket; socket.create_connection(('127.0.0.1',4000),timeout=1).close()" 2>/dev/null && break
            sleep 0.2
          done
          ./target/release/loom-loadtest \
            --addr 127.0.0.1:4000 \
            --mix warp/loadbot/mix.tsv \
            --players 150 \
            --duration-secs 90 \
            --ramp-per-sec 15 \
            --slow-reader-fraction 0.1 \
            --metrics-url http://127.0.0.1:4001/metrics \
            --metrics-scrape-ms 1000 \
            --timeline-bucket-ms 5000 \
            --out results/ci-e1-1 \
            --note "mudlib LoomMud/warp@${{ steps.warp-pin.outputs.rev }} (pinned in warp.ref)" \
            --fail-on-sla-miss
          status=$?
          # OBI-344 follow-up (main run 37862921160 on eaf9ceb): everything
          # below this line collects evidence; none of it decides the verdict,
          # and `exit $status` at the bottom is the only thing that does. The
          # runner's default `bash -e -o pipefail` meant one non-zero command in
          # this tail aborted the step *after* the p99 verdict had passed: on
          # that run the world thread recorded zero stalls, so no `kind="..."`
          # label existed, `grep -oE` exited 1, pipefail propagated it through
          # the pipeline, and the command substitution failed the step -- a gate
          # that goes red exactly when the world thread behaves. Turn errexit
          # off here. Cost: a failed `cp` of the serve log/metrics into results/
          # no longer fails the step; `upload-artifact` runs `if: always()` with
          # `if-no-files-found: warn`, so the missing file is still visible.
          set +e
          # OBI-344 (salvaged from PR #157's evidence tail; the paced drain it was
          # written for was withdrawn once #159 took character durability off the
          # world thread): read the save count *after* giving the server a chance
          # to finish writing. The p99 verdict is not the only thing this gate is
          # evidence for -- the step also reports `save_path: objects_saved=N` and
          # scrapes `loom_world_loop_stalls_total`, and both are read at a single
          # instant while persistence is a queue that can still be draining after
          # the last command. Without the wait, a run whose writes land late
          # reports fewer saved objects *and* fewer stall events than happened,
          # which would read as an improvement for a pure reporting-timing reason.
          # Non-gating: an unfinished drain is printed, never failed, and the
          # wait is bounded so a wedged writer cannot hang the job. Measured on a
          # build off current `main`, where teardown is still synchronous, one of
          # six saves had not landed when the last command finished -- the loop
          # waited 1 s and then read the true count, so this is already
          # load-bearing rather than a placeholder for #159.
          settle_start=$(date +%s)
          while [ "$(find "$SAVES" -type f -name '*.o' 2>/dev/null | wc -l)" -lt 150 ] \
                 && [ $(( $(date +%s) - settle_start )) -lt 60 ]; do
            sleep 1
          done
          settled=$(find "$SAVES" -type f -name '*.o' 2>/dev/null | wc -l)
          settle_wait=$(( $(date +%s) - settle_start ))
          if [ "$settled" -ge 150 ]; then
            settle_done=yes
          else
            settle_done=no
          fi
          echo "save_settle: objects_saved=$settled waited=${settle_wait}s drain_complete=$settle_done"
          # Scrape before stopping: the previous version of this step curled
          # `/metrics` *after* `kill`, so the "final /metrics" section was
          # always empty and the artifact's only server numbers were the
          # in-run scrapes inside the report.
          curl -s --max-time 2 http://127.0.0.1:4001/metrics > /tmp/loom-metrics-final.txt 2>/dev/null || true
          kill "$(cat /tmp/loom-serve.pid)" || true
          wait 2>/dev/null || true
          # The serve log is the attribution evidence: world-thread stall
          # warnings with their event kind, and runtime-error detail. It is
          # printed *and* uploaded so a red run is readable without the
          # artifact in hand.
          echo "::group::loom serve log"
          cat /tmp/loom-serve.log
          echo "::endgroup::"
          cp /tmp/loom-serve.log results/loom-serve.log
          cp /tmp/loom-metrics-final.txt results/loom-metrics-final.txt
          {
            echo "## loadtest stderr markers"
            grep -cE "ERROR|WARN" /tmp/loom-serve.log || true
            echo "## final /metrics (world loop + net command counters)"
            grep -E "^loom_(world_loop|net_command)" /tmp/loom-metrics-final.txt || echo "(none -- server not instrumented or already stopped)"
            echo "## final /metrics (runtime errors)"
            grep -E "^loom_runtime_errors" /tmp/loom-metrics-final.txt || echo "(no loom_runtime_errors_total series)"
          } >> results/loom-serve.log 2>&1 || true
          # OBI-344: prove the save path was exercised, and keep a mudlib
          # runtime error from being silently counted and forgotten. Neither
          # check gates the SLA -- the p99 verdict below is the only thing
          # that decides pass/fail -- they surface as warnings annotations.
          saved=$(find "$SAVES" -type f -name '*.o' 2>/dev/null | wc -l)
          echo "save_path: objects_saved=$saved players=150 save_dir=$SAVES"
          if [ -s /tmp/loom-metrics-final.txt ]; then
            if grep -q "^loom_runtime_errors_total" /tmp/loom-metrics-final.txt; then
              runtime_errors=$(awk '/^loom_runtime_errors_total/ {s+=$2} END {printf "%d", s+0}' /tmp/loom-metrics-final.txt)
              echo "runtime_errors_total=$runtime_errors"
              if [ "$runtime_errors" != "0" ]; then
                echo "::warning title=OBI-344 runtime errors::E1.1 recorded $runtime_errors mudlib runtime error(s); see results/loom-serve.log (does not affect the p99 verdict)"
              fi
            else
              echo "runtime_errors_total=0 (no loom_runtime_errors_total series in the scrape; that family is created on the first error)"
            fi
          else
            echo "::warning title=OBI-344 runtime errors unmeasured::the server did not expose /metrics at the end of the run, so the runtime-error count is unknown"
          fi
          if [ "$saved" -eq 0 ]; then
            echo "::warning title=OBI-344 save path not exercised::no save objects were written to $SAVES; E1.1 is not measuring character persistence"
          fi
          # OBI-344: what the world thread did, independent of whether the
          # sampled latency noticed. A stall while all 150 sessions are being
          # torn down lands *after* --duration-secs, so it cannot reach p99 at
          # all -- and a green verdict would otherwise read as "the world thread
          # never blocked". Printed, and annotated as a warning; it does not
          # decide pass/fail, the p99 verdict does.
          durmax=$(awk '/^loom_world_loop_duration_ms_max/ {print $2; exit}' /tmp/loom-metrics-final.txt)
          stalls=$(awk '/^loom_world_loop_stalls_total/ {s+=$2} END {printf "%d", s+0}' /tmp/loom-metrics-final.txt)
          kinds=$(grep -oE 'kind="[a-z_]+"' /tmp/loom-metrics-final.txt | sed 's/kind="//;s/"//' | sort -u | tr '\n' ' ')
          echo "world_loop: worst_iteration_ms=${durmax:-unknown} stall_events=${stalls:-0} kinds=${kinds:-none}"
          if [ -n "$durmax" ] && [ "$(awk -v d="$durmax" 'BEGIN {print (d > 50) ? 1 : 0}')" = "1" ]; then
            echo "::warning title=OBI-344 world-thread stall recorded::E1.1 recorded $stalls world-loop iteration(s) over the 50 ms stall budget, worst ${durmax} ms (kinds: ${kinds:-none}). Check whether they fall inside the sampled window before treating the p99 verdict as evidence about them."
          fi
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.classify.outputs.runtime != 'false'
        with:
          name: loadtest-e1-1-report
          path: |
            results/ci-e1-1.*
            results/loom-serve.log
            results/loom-metrics-final.txt
            results/runner-context-before.txt

