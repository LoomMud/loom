name: release-image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNS_ON && (startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON) || 'arc-runner-set-loommud' }}
    env:
      IMAGE: ghcr.io/loommud/loom
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Ensure tools (ARC minimal runner image)
        run: scripts/ci-ensure-tools.sh jq:jq gh:gh curl:curl

      # Same action as ci.yml's `deny` job, so release and PR gating agree
      # (cargo-deny 0.18.5 cannot parse CVSS 4.0 advisories).
      - name: cargo deny (licenses, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources advisories

      - name: Install syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin" v1.30.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.6.1
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The ARC scale set's minimal `actions-runner` image ships the docker CLI
      # without the buildx plugin (OBI-140), so `docker buildx ...` falls
      # through to plain `docker` usage. Install a pinned, checksum-verified
      # plugin when absent; no-op on GitHub-hosted runners.
      - name: Ensure docker buildx plugin
        run: |
          set -euo pipefail
          if docker buildx version >/dev/null 2>&1; then
            docker buildx version
            exit 0
          fi
          BUILDX_VERSION=v0.37.1
          BUILDX_SHA256=9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b
          plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$plugins"
          curl -sSfL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" -o "$plugins/docker-buildx"
          echo "${BUILDX_SHA256}  $plugins/docker-buildx" | sha256sum -c -
          chmod +x "$plugins/docker-buildx"
          docker buildx version

      - name: Set up buildx
        run: |
          set -euo pipefail
          # Idempotent: a persistent self-hosted runner keeps the builder.
          docker buildx use loom-builder 2>/dev/null \
            || docker buildx create --name loom-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push image
        run: |
          set -euo pipefail
          tags=("-t" "${IMAGE}:${TAG}")
          if [[ "${TAG}" != *-* ]]; then
            tags+=("-t" "${IMAGE}:latest")
          fi
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            "${tags[@]}" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            .
          digest=$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/build-metadata.json")
          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "missing image digest in build metadata" >&2
            cat "$RUNNER_TEMP/build-metadata.json" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Generate image SBOM
        run: |
          set -euo pipefail
          syft "${IMAGE}@${IMAGE_DIGEST}" -o cyclonedx-json="loom-${TAG}-sbom.cdx.json"

      - name: Check image SBOM licenses
        run: scripts/check-image-sbom-licenses.sh "loom-${TAG}-sbom.cdx.json"

      - name: Sign image with cosign keyless
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"

      - name: Verify image signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/LoomMud/loom/.github/workflows/release-image.yml@refs/tags/${TAG}$" \
            "${IMAGE}@${IMAGE_DIGEST}"

      - name: Publish pre-release / release
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *-* ]]; then
            gh release create "${TAG}" --prerelease --generate-notes || gh release edit "${TAG}" --prerelease --title "${TAG}"
          else
            gh release create "${TAG}" --generate-notes || gh release edit "${TAG}" --latest --title "${TAG}"
          fi
          gh release upload "${TAG}" "loom-${TAG}-sbom.cdx.json" --clobber

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
