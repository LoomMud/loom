#
# Licence gate (spec §4.4, board decision OBI-44): Loom is AGPL-3.0-only, so
# every dependency must be OSI-approved AND compatible with AGPL-3.0 outbound.
# Allowed: permissive (MIT, Apache-2.0, BSD, ISC, Zlib, Unicode, BSL-1.0,
# CC0-1.0), weak copyleft MPL-2.0 (GPL-compatible via §3.3), and the v3
# GPL family (AGPL-3.0, GPL-3.0, LGPL-3.0; AGPL-3.0 §13 permits combining
# with GPL-3.0). Never: GPL-2.0-only / LGPL-2.x-only, EPL, CDDL, SSPL, BUSL,
# CC-NC, or other "source-available" terms. Changing this list needs CTO review.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Also check our own (unpublished) workspace crates: each must declare
# AGPL-3.0-only via `license.workspace = true`.
[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# RUSTSEC-2023-0071 ("Marvin Attack", `rsa` crate, no patch available):
# accepted per CTO review (OBI-191) -- the only private-key operation on
# this path is RS256 App-JWT *signing* with driver-chosen, fixed claims
# (iat/exp/iss), roughly once per 55 minutes (loom-git::github's token
# cache refresh skew), not a remote decryption oracle on attacker-chosen
# input. Remove this ignore in OBI-215, which moves JWT signing onto the
# TLS transport's own constant-time RSA (ring/aws-lc-rs) once that
# transport exists -- a second RSA implementation has no benefit after
# that lands.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa: RS256 App-JWT signing only, fixed inputs, ~1/55min; no decryption oracle. Remove with OBI-215 (move signing to ring/aws-lc-rs with the TLS transport)." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
