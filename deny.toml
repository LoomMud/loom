# SPDX-FileCopyrightText: 2026 Oberfield
# SPDX-License-Identifier: LicenseRef-Oberfield-Proprietary
#
# Licence gate (spec §4.4): OSI-approved, compatible with both Apache-2.0 and
# AGPL-3.0 outbound. No GPL/LGPL/AGPL until the board picks the licence; never
# non-OSI (SSPL, BSL, CC-NC, "source-available"). Changing this list needs CTO review.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Our own crates are proprietary until relicensing.
[[licenses.exceptions]]
allow = ["LicenseRef-Oberfield-Proprietary"]
crate = "loom-syntax"
[[licenses.exceptions]]
allow = ["LicenseRef-Oberfield-Proprietary"]
crate = "loom-vm"
[[licenses.exceptions]]
allow = ["LicenseRef-Oberfield-Proprietary"]
crate = "loom-net"
[[licenses.exceptions]]
allow = ["LicenseRef-Oberfield-Proprietary"]
crate = "loom-cli"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
